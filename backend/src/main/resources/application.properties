server.port=8081

# Spring Application
spring.application.name=custfm-backend

# H2 In-Memory / File Database for instant local execution
spring.datasource.url=jdbc:h2:file:./data/custfm;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (restricted to localhost for security)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# POS Integration Security Key
famousmobiles.pos.api-key=${POS_API_KEY:famous-pos-sec-2026}

# Service Area Configurations
famousmobiles.service.hub-lat=17.4058
famousmobiles.service.hub-lng=78.3879
famousmobiles.service.max-radius-km=6.0
famousmobiles.service.subsequent-visit-fee=69.00
famousmobiles.service.first-visit-fee=0.00
famousmobiles.service.operating-hours=10:00 AM – 1:00 AM

# SMS Gateway Configurations (Pluggable Fast2SMS / Twilio / Console Dev)
famousmobiles.sms.provider=${SMS_PROVIDER:fast2sms}
famousmobiles.sms.fast2sms.api-key=${FAST2SMS_API_KEY:lgZgKUklXUtdPvmIP4a0yNPJlSwFGqGaOmwqvyqqoVrYlMkqSdq1gYMH3ip2dCHfiGzm5ZrzVjVU1Y8I}
famousmobiles.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
famousmobiles.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
famousmobiles.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
